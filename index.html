<!DOCTYPE html>
<html>
    <head>
        <title>COUNTER APP</title>
         <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 class="h1">Simple Counter App</h1>

        <div class="counterbox">
        <button class="box btn" id="increase-btn">+</button>
        <div class="box count" id="count-number">1</div>
        <button class="box btn" id="decrease-btn">-</button>
        </div>
    </body>
    <script src="script.js"></script>
</html>
